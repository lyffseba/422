name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash
      - name: pixi install
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi install
      - name: verify trees
        run: export PATH="$HOME/.pixi/bin:$PATH" && make verify
      - name: build smoke
        run: export PATH="$HOME/.pixi/bin:$PATH" && make check
      - name: functional tests
        run: export PATH="$HOME/.pixi/bin:$PATH" && make test
      - name: bench push_swap
        run: export PATH="$HOME/.pixi/bin:$PATH" && make bench
